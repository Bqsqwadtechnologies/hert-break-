name: Release Build

# Automatic release builds are paused during the content-writing phase.
# Restore push triggers when the library is ready for final verification.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build signed release APK and AAB
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Restore and validate release keystore
        env:
          BQ_RELEASE_KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          BQ_RELEASE_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          BQ_RELEASE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          BQ_RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          for name in BQ_RELEASE_KEYSTORE_BASE64 BQ_RELEASE_STORE_PASSWORD BQ_RELEASE_KEY_ALIAS BQ_RELEASE_KEY_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Required signing secret $name is missing or unavailable to this workflow."
              exit 1
            fi
          done
          if ! printf '%s' "$BQ_RELEASE_KEYSTORE_BASE64" | python3 -c 'import base64,sys; s="".join(sys.stdin.read().split()); sys.stdout.buffer.write(base64.b64decode(s, validate=True))' > app/release-key.jks; then
            rm -f app/release-key.jks
            echo "::error::KEYSTORE_BASE64 is malformed or incomplete."
            exit 1
          fi
          if [[ ! -s app/release-key.jks ]]; then
            echo "::error::Decoded keystore is empty."
            exit 1
          fi
          if ! keytool -list -keystore app/release-key.jks -storepass "$BQ_RELEASE_STORE_PASSWORD" >/dev/null 2>&1; then
            echo "::error::The keystore could not be opened. Check the matching password."
            exit 1
          fi
          if ! keytool -list -keystore app/release-key.jks -storepass "$BQ_RELEASE_STORE_PASSWORD" -alias "$BQ_RELEASE_KEY_ALIAS" >/dev/null 2>&1; then
            echo "::error::KEY_ALIAS was not found in the keystore."
            exit 1
          fi
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.4.1
        with:
          gradle-version: '9.0.0'
      - name: Build signed release APK and bundle
        env:
          BQ_RELEASE_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          BQ_RELEASE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          BQ_RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle :app:assembleRelease :app:bundleRelease --stacktrace --no-daemon --warning-mode all
      - name: Verify APK and AAB signatures
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -print -quit)"
          AAB="$(find app/build/outputs/bundle/release -maxdepth 1 -name '*.aab' -print -quit)"
          test -n "$APK" && test -n "$AAB"
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$HOME/Android/Sdk}}"
          APKSIGNER="$(find "$SDK_ROOT/build-tools" -type f -name apksigner -print 2>/dev/null | sort -V | tail -n 1)"
          if [[ -z "$APKSIGNER" ]]; then
            echo "::error::Could not locate apksigner under $SDK_ROOT/build-tools."
            exit 1
          fi
          "$APKSIGNER" verify --verbose "$APK"
          jarsigner -verify "$AAB" >/dev/null
      - name: Upload release artifacts
        uses: actions/upload-artifact@v7.0.2
        with:
          name: signed-release-artifacts
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 30
      - name: Remove temporary keystore
        if: always()
        run: rm -f app/release-key.jks
