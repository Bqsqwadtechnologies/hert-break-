name: Release Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build signed release APK and AAB
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore and validate release keystore
        env:
          BQ_RELEASE_KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          BQ_RELEASE_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          BQ_RELEASE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          BQ_RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          for name in BQ_RELEASE_KEYSTORE_BASE64 BQ_RELEASE_STORE_PASSWORD BQ_RELEASE_KEY_ALIAS BQ_RELEASE_KEY_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Required signing secret $name is missing or unavailable to this workflow."
              exit 1
            fi
          done

          # GitHub secrets are text. Remove whitespace only; never strip Base64 letters.
          if ! printf '%s' "$BQ_RELEASE_KEYSTORE_BASE64" | python3 -c 'import base64,sys; s="".join(sys.stdin.read().split()); sys.stdout.buffer.write(base64.b64decode(s, validate=True))' > app/release-key.jks; then
            rm -f app/release-key.jks
            echo "::error::KEYSTORE_BASE64 is malformed or incomplete. Paste the complete contents of the matching Base64 keystore file into that secret."
            exit 1
          fi
          if [[ ! -s app/release-key.jks ]]; then
            echo "::error::Decoded keystore is empty."
            exit 1
          fi
          if ! keytool -list -keystore app/release-key.jks -storepass "$BQ_RELEASE_STORE_PASSWORD" > /tmp/keystore-list.txt 2>&1; then
            cat /tmp/keystore-list.txt
            echo "::error::The keystore could not be opened. Check that KEYSTORE_BASE64 and KEYSTORE_PASSWORD belong to the same JKS file."
            exit 1
          fi
          if ! keytool -list -keystore app/release-key.jks -storepass "$BQ_RELEASE_STORE_PASSWORD" -alias "$BQ_RELEASE_KEY_ALIAS" >/dev/null 2>&1; then
            echo "::error::The keystore opens, but KEY_ALIAS was not found. Check the alias in the matching keystore."
            keytool -list -keystore app/release-key.jks -storepass "$BQ_RELEASE_STORE_PASSWORD" | sed -n '1,20p'
            exit 1
          fi
          echo "Release keystore and configured alias validated."

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.4.1
        with:
          gradle-version: '9.0.0'

      - name: Verify Gradle
        run: gradle --version

      - name: Build signed release APK and bundle
        env:
          BQ_RELEASE_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          BQ_RELEASE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          BQ_RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle :app:assembleRelease :app:bundleRelease --stacktrace --no-daemon --warning-mode all

      - name: Verify APK and AAB signatures
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -print -quit)"
          AAB="$(find app/build/outputs/bundle/release -maxdepth 1 -name '*.aab' -print -quit)"
          test -n "$APK" && test -n "$AAB"
          apksigner verify --verbose "$APK"
          jarsigner -verify "$AAB" >/dev/null
          echo "Both release outputs have valid signatures."

      - name: Upload release artifacts
        uses: actions/upload-artifact@v7.0.2
        with:
          name: signed-release-artifacts
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 30

      - name: Remove temporary keystore
        if: always()
        run: rm -f app/release-key.jks
