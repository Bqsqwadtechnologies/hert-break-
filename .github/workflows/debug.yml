name: Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: debug-apk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug-apk:
    name: Test and build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Gradle and caching
        uses: gradle/actions/setup-gradle@v6

      - name: Verify Gradle wrapper
        run: ./gradlew --version

      - name: Run unit tests
        run: ./gradlew test --continue --stacktrace

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Verify APK output
        shell: bash
        run: |
          set -euo pipefail
          APK_DIR="app/build/outputs/apk/debug"
          test -d "$APK_DIR"
          find "$APK_DIR" -maxdepth 1 -type f -name '*.apk' -print -quit | grep -q .
          ls -lh "$APK_DIR"/*.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: heartbreak-healer-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
